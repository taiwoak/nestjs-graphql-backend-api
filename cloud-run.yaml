apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: awari-api
  namespace: default
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1" 
        autoscaling.knative.dev/maxScale: "5"
        run.googleapis.com/cpu-throttling: "false"
    spec:
      containers:
        - image: gcr.io/$PROJECT_ID/awari-api:latest
          name: awari-api
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: MONGODB_URI
              value: "YOUR_MONGODB_ATLAS_URI"
            - name: REDIS_HOST
              value: "YOUR_REDIS_HOST"
            - name: REDIS_PORT
              value: "6379"
          resources:
            limits:
              cpu: 1
              memory: 512Mi
      timeoutSeconds: 300
  traffic:
    - latestRevision: true
      percent: 100
